name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Garantir SDK Platform 37 e Build-Tools 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for d in "$ANDROID_HOME"/cmdline-tools/*/bin "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                SDKMANAGER="$d/sdkmanager"
                break
              fi
            done
          fi
          echo "Usando sdkmanager em: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Build do APK de debug
        run: gradle assembleDebug --no-daemon

      - name: Localizar o APK gerado
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publicar como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: "Build automático #${{ github.run_number }}"
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
          make_latest: true
          files: ${{ steps.apk.outputs.path }}
